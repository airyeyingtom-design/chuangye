<body><h1>慢慢来</h1><div>写给心情不好的你 💖</div><audio controls src="manmanlai.mp3"></audio><p>今天的风有点凉，心里下了一场小雨</p><p>走过钱塘的街口，灯一盏一盏亮起</p><p>那些说不出口的累，就先放在这里</p><p>你不用一直坚强，偶尔也可以叹气</p><p>慢慢来，慢慢来，乌云总会散开</p><p>一千块的起点，也能开出花来</p><p>慢慢来，慢慢来，今天先抱抱自己</p><p>明天的太阳，还会照在你那里</p><p>泡泡一个一个破，烦恼一个一个走</p><p>你戳掉的不是游戏，是心里的那些愁</p><p>兄弟们都在身边，路不用一个人走</p><p>跌倒了就坐一会儿，再笑着抬起头</p><p>慢慢来，慢慢来，乌云总会散开</p><p>你做过的每件事，都没有白白存在</p><p>慢慢来，慢慢来，今晚先好好睡去</p><p>醒来的时候，世界会温柔一点点</p><p style="margin-top:30px"><a href="../bubble/">去玩戳泡泡 🎈</a></p></body></html>
