<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .metric {
    position: absolute;
    left: 48px;
    right: 48px;
    padding: 28px 32px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 34px;
  }
  .metric:last-child { border-bottom: 0; }
  .metric .label { color: var(--muted); }
  .metric .val { font-family: var(--font-display); font-size: 56px; font-weight: 700; }
  .metric.bad .val { color: var(--warn); }
  .metric.ok .val { color: #6dcf8a; }
  .x {
    position: absolute;
    right: 40px;
    top: 40px;
    font-size: 28px;
    letter-spacing: 0.2em;
    color: var(--warn);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="bar"><strong>PITFALL 01</strong><span>虚荣指标</span></div>
  <div class="num" id="num">01</div>
  <h2 class="title" id="title">只谈粉丝<br>不谈转化</h2>
  <p class="sub" id="sub">涨粉、爆款说得天花乱坠，询盘、成交、复购一句不提。</p>
  <div class="panel" id="panel">
    <div class="x">假繁荣</div>
    <div class="metric" style="top: 120px"><span class="label">粉丝</span><span class="val" id="fans">+0</span></div>
    <div class="metric" style="top: 260px"><span class="label">点赞</span><span class="val" id="likes">0</span></div>
    <div class="metric bad" style="top: 400px"><span class="label">成交</span><span class="val" id="sales">¥0</span></div>
  </div>
  <div class="progress"><i id="bar"></i></div>
</div>
<script type="module">
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function ease(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }
window.film = {
  duration: 7,
  ready: document.fonts.ready,
  frame(t) {
    const e = (d, delay = 0) => ease((t - delay) / d);
    for (const id of ["num", "title", "sub", "panel"]) {
      const el = document.getElementById(id);
      const delay = id === "panel" ? 0.45 : id === "sub" ? 0.35 : 0.1;
      el.style.opacity = String(e(0.5, delay));
      el.style.transform = `translateY(${(1 - e(0.55, delay)) * 28}px)`;
    }
    const fans = Math.floor(12800 * ease((t - 1.2) / 2.2));
    const likes = Math.floor(8600 * ease((t - 1.5) / 2.0));
    document.getElementById("fans").textContent = `+${fans.toLocaleString("en-US")}`;
    document.getElementById("likes").textContent = likes.toLocaleString("en-US");
    document.getElementById("sales").textContent = t > 3.2 ? "¥0" : "—";
    document.getElementById("bar").style.width = `${(t / 7) * 100}%`;
  }
};
</script>
</body>
</html>
