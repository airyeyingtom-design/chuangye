<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .lockbox {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }
  .lock {
    width: 180px;
    height: 180px;
    border: 5px solid var(--amber);
    border-radius: 28px;
    position: relative;
  }
  .lock::before {
    content: "";
    position: absolute;
    left: 42px;
    top: -78px;
    width: 86px;
    height: 100px;
    border: 5px solid var(--amber);
    border-bottom: 0;
    border-radius: 86px 86px 0 0;
  }
  .lock-key {
    position: absolute;
    left: 50%;
    top: 58%;
    width: 28px;
    height: 28px;
    margin: -14px 0 0 -14px;
    border-radius: 50%;
    border: 5px solid var(--amber);
  }
  .denied {
    margin-top: 48px;
    font-size: 36px;
    color: var(--warn);
    letter-spacing: 0.2em;
  }
  .rows {
    position: absolute;
    left: 48px;
    right: 48px;
    top: 48px;
    font-size: 30px;
    color: var(--muted);
  }
  .rows div {
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="bar"><strong>PITFALL 03</strong><span>权限失控</span></div>
  <div class="num" id="num">03</div>
  <h2 class="title" id="title">要权限<br>不给数据</h2>
  <p class="sub" id="sub">密码全拿走，后台一问就“算法保密”。</p>
  <div class="panel" id="panel">
    <div class="rows">
      <div><span>账号密码</span><span style="color:var(--warn)">已移交</span></div>
      <div><span>后台数据</span><span style="color:var(--warn)">拒绝查看</span></div>
      <div><span>投放明细</span><span style="color:var(--warn)">未提供</span></div>
    </div>
    <div class="lockbox" id="lock" style="top: 280px; height: 320px;">
      <div>
        <div class="lock"><i class="lock-key"></i></div>
        <div class="denied">ACCESS DENIED</div>
      </div>
    </div>
  </div>
  <div class="progress"><i id="bar"></i></div>
</div>
<script type="module">
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function ease(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }
window.film = {
  duration: 7,
  ready: document.fonts.ready,
  frame(t) {
    const e = (d, delay = 0) => ease((t - delay) / d);
    for (const id of ["num", "title", "sub", "panel"]) {
      const el = document.getElementById(id);
      const delay = id === "panel" ? 0.4 : 0.1;
      el.style.opacity = String(e(0.5, delay));
      el.style.transform = `translateY(${(1 - e(0.55, delay)) * 28}px)`;
    }
    const pulse = 0.85 + 0.15 * Math.sin(t * 6);
    document.getElementById("lock").style.opacity = String(0.55 + 0.45 * e(0.5, 1.2));
    document.getElementById("lock").style.transform = `scale(${pulse})`;
    document.getElementById("bar").style.width = `${(t / 7) * 100}%`;
  }
};
</script>
</body>
</html>
