<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .wrap {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 200px;
  }
  .wrap h1 {
    font-family: var(--font-display);
    font-size: 72px;
    margin-bottom: 64px;
  }
  .qs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 36px;
  }
  .q {
    border: 1px solid var(--line);
    background: rgba(20, 28, 40, 0.75);
    padding: 48px 40px;
    min-height: 320px;
  }
  .q .n {
    color: var(--amber);
    font-size: 28px;
    letter-spacing: 0.2em;
    margin-bottom: 28px;
  }
  .q p {
    font-size: 42px;
    line-height: 1.4;
    font-family: var(--font-display);
  }
  .foot {
    position: absolute;
    left: 96px;
    bottom: 100px;
    font-size: 36px;
    color: var(--warn);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="bar"><strong>BEFORE YOU SIGN</strong><span>签约前三问</span></div>
  <div class="wrap" id="wrap">
    <h1 id="h1">签约前，先问清这三句</h1>
    <div class="qs">
      <div class="q" id="q1"><div class="n">01</div><p>转化目标<br>是什么？</p></div>
      <div class="q" id="q2"><div class="n">02</div><p>每周交付<br>看什么？</p></div>
      <div class="q" id="q3"><div class="n">03</div><p>数据权限<br>谁掌握？</p></div>
    </div>
  </div>
  <div class="foot" id="foot">问不清，就别签。</div>
  <div class="progress"><i id="bar"></i></div>
</div>
<script type="module">
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function ease(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }
window.film = {
  duration: 9,
  ready: document.fonts.ready,
  frame(t) {
    const e = (d, delay = 0) => ease((t - delay) / d);
    document.getElementById("h1").style.opacity = String(e(0.5, 0.1));
    document.getElementById("h1").style.transform = `translateY(${(1 - e(0.55, 0.1)) * 24}px)`;
    ["q1", "q2", "q3"].forEach((id, i) => {
      const el = document.getElementById(id);
      const ee = e(0.5, 0.6 + i * 0.35);
      el.style.opacity = String(ee);
      el.style.transform = `translateY(${(1 - ee) * 36}px)`;
    });
    document.getElementById("foot").style.opacity = String(e(0.5, 3.2));
    document.getElementById("bar").style.width = `${(t / 9) * 100}%`;
  }
};
</script>
</body>
</html>
