<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .chain {
    position: absolute;
    left: 48px;
    right: 48px;
    top: 100px;
  }
  .person {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 28px 0;
    border-bottom: 1px solid var(--line);
    font-size: 34px;
  }
  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3a4658, #1c2430);
    border: 2px solid var(--line);
  }
  .person.gone {
    opacity: 0.35;
    text-decoration: line-through;
    color: var(--muted);
  }
  .blame {
    margin-top: 48px;
    font-size: 40px;
    color: var(--warn);
    font-family: var(--font-display);
    text-align: center;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="bar"><strong>PITFALL 06</strong><span>责任真空</span></div>
  <div class="num" id="num">06</div>
  <h2 class="title" id="title">换人频繁<br>没人负责</h2>
  <p class="sub" id="sub">对接人三天两头换，策略推倒重来，出了问题互相甩锅。</p>
  <div class="panel" id="panel">
    <div class="chain">
      <div class="person gone" id="p1"><div class="avatar"></div><span>运营 A · 已离职</span></div>
      <div class="person gone" id="p2"><div class="avatar"></div><span>运营 B · 已转岗</span></div>
      <div class="person" id="p3"><div class="avatar"></div><span>运营 C · 刚接手</span></div>
      <div class="blame" id="blame">「这是上一任的锅」</div>
    </div>
  </div>
  <div class="progress"><i id="bar"></i></div>
</div>
<script type="module">
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function ease(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }
window.film = {
  duration: 6.5,
  ready: document.fonts.ready,
  frame(t) {
    const e = (d, delay = 0) => ease((t - delay) / d);
    for (const id of ["num", "title", "sub", "panel"]) {
      const el = document.getElementById(id);
      const delay = id === "panel" ? 0.35 : 0.1;
      el.style.opacity = String(e(0.5, delay));
      el.style.transform = `translateY(${(1 - e(0.55, delay)) * 28}px)`;
    }
    document.getElementById("p1").style.opacity = String(0.35 * e(0.4, 0.9));
    document.getElementById("p2").style.opacity = String(0.35 * e(0.4, 1.4));
    document.getElementById("p3").style.opacity = String(e(0.4, 1.9));
    document.getElementById("blame").style.opacity = String(e(0.45, 3.0));
    document.getElementById("bar").style.width = `${(t / 6.5) * 100}%`;
  }
};
</script>
</body>
</html>
