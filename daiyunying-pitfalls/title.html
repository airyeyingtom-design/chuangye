<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .hero {
    position: absolute;
    left: 96px;
    top: 280px;
    right: 96px;
  }
  .eyebrow {
    font-size: 30px;
    letter-spacing: 0.28em;
    color: var(--amber);
    margin-bottom: 36px;
  }
  .hero h1 {
    font-family: var(--font-display);
    font-size: 118px;
    line-height: 1.12;
    font-weight: 700;
    max-width: 1400px;
  }
  .hero h1 em {
    font-style: normal;
    color: var(--warn);
  }
  .tagline {
    margin-top: 48px;
    font-size: 38px;
    color: var(--muted);
    max-width: 980px;
    line-height: 1.5;
  }
  .stamp {
    position: absolute;
    right: 140px;
    bottom: 160px;
    width: 260px;
    height: 260px;
    border: 6px solid rgba(255, 94, 58, 0.85);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--warn);
    font-family: var(--font-display);
    font-size: 54px;
    font-weight: 700;
    letter-spacing: 0.12em;
    transform: rotate(-18deg);
    opacity: 0;
  }
</style>
</head>
<body>
<div class="stage" id="root">
  <div class="grain"></div>
  <div class="bar"><strong>OPEN BRIEF</strong><span>代运营避坑 · 01</span></div>
  <div class="hero">
    <div class="eyebrow" id="eyebrow">六 个 最 常 见 的 坑</div>
    <h1 id="h1">代运营，为什么<br>容易被<em>坑</em>？</h1>
    <p class="tagline" id="tag">钱花了，账号却越做越空——先别急着签合同。</p>
  </div>
  <div class="stamp" id="stamp">慎签</div>
  <div class="progress"><i id="bar"></i></div>
</div>
<script type="module">
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function ease(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }

window.film = {
  duration: 7,
  ready: document.fonts.ready,
  frame(t) {
    const e = (d, delay = 0) => ease((t - delay) / d);
    document.getElementById("eyebrow").style.opacity = String(e(0.5, 0.1));
    document.getElementById("eyebrow").style.transform = `translateY(${(1 - e(0.6, 0.1)) * 24}px)`;
    document.getElementById("h1").style.opacity = String(e(0.55, 0.25));
    document.getElementById("h1").style.transform = `translateY(${(1 - e(0.7, 0.25)) * 36}px)`;
    document.getElementById("tag").style.opacity = String(e(0.5, 1.0));
    const s = document.getElementById("stamp");
    const se = e(0.45, 2.2);
    s.style.opacity = String(se * 0.95);
    s.style.transform = `rotate(-18deg) scale(${0.7 + 0.3 * se})`;
    document.getElementById("bar").style.width = `${(t / 7) * 100}%`;
  }
};
</script>
</body>
</html>
