<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .doc {
    position: absolute;
    inset: 48px;
    font-size: 30px;
    line-height: 1.7;
    color: var(--muted);
  }
  .doc h3 {
    color: var(--paper);
    font-size: 36px;
    margin-bottom: 28px;
    font-family: var(--font-display);
  }
  .doc .blur {
    filter: blur(3px);
    opacity: 0.55;
  }
  .mark {
    display: inline-block;
    margin-top: 28px;
    padding: 10px 18px;
    border: 2px solid var(--warn);
    color: var(--warn);
    font-size: 28px;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="bar"><strong>PITFALL 02</strong><span>交付不清</span></div>
  <div class="num" id="num">02</div>
  <h2 class="title" id="title">合同含糊<br>交付说不清</h2>
  <p class="sub" id="sub">满篇“努力运营”“保证曝光”，没有可验收的标准。</p>
  <div class="panel" id="panel">
    <div class="doc">
      <h3>服务协议（节选）</h3>
      <p>乙方将尽力提升账号影响力…</p>
      <p class="blur">具体发布频次、选题方向、转化目标见附件（未提供）</p>
      <p>甲方应按时支付服务费，逾期视为违约…</p>
      <div class="mark" id="mark">无法验收 ✕</div>
    </div>
  </div>
  <div class="progress"><i id="bar"></i></div>
</div>
<script type="module">
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function ease(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }
window.film = {
  duration: 6.5,
  ready: document.fonts.ready,
  frame(t) {
    const e = (d, delay = 0) => ease((t - delay) / d);
    for (const id of ["num", "title", "sub", "panel"]) {
      const el = document.getElementById(id);
      const delay = id === "panel" ? 0.4 : 0.1;
      el.style.opacity = String(e(0.5, delay));
      el.style.transform = `translateY(${(1 - e(0.55, delay)) * 28}px)`;
    }
    const m = document.getElementById("mark");
    const me = e(0.4, 2.0);
    m.style.opacity = String(me);
    m.style.transform = `scale(${0.85 + 0.15 * me})`;
    document.getElementById("bar").style.width = `${(t / 6.5) * 100}%`;
  }
};
</script>
</body>
</html>
